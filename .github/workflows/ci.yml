name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Treasury contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/treasury
      - run: cargo fmt --check
        working-directory: contracts/treasury
      - run: cargo test
        working-directory: contracts/treasury
